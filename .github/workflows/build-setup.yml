name: build-setup

# 触发：自托管编译器源码/构建链改动 push 自动构建验证；也可手动触发（workflow_dispatch）
# 说明：本工作流只验证「从冻结种子自举出 shadow 编译器」这一核心链路是否仍然可构建；
#       Windows 安装器打包（pkg/make_setup.sh 等）为本地操作，打包脚本有意不入库，不在 CI 进行。
on:
  push:
    paths:
      - 'src/**'
      - 'rt/**'
      - 'bootstrap/**'
      - 'tools/**'
      - '.github/workflows/build-setup.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 注入 MSVC + Windows SDK 的 LIB/INCLUDE/PATH（CI 默认 bash 没有 VS 开发者环境）。
      # LLVM-C 的导入库经 #pragma comment(lib,"winhttp.lib") 间接要求 Windows SDK 的 winhttp.lib，
      # 自举链接阶段 lld-link 需经 LIB 找到它。
      - name: Setup MSVC + Windows SDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download LLVM 22.1.0
        run: |
          LLVM_DIR="$PWD/clang+llvm-22.1.0-x86_64-pc-windows-msvc"
          curl -L --fail -o llvm.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/clang+llvm-22.1.0-x86_64-pc-windows-msvc.tar.xz
          python - <<'EOF'
          import tarfile
          with tarfile.open('llvm.tar.xz', 'r:xz') as t:
              t.extractall()
          EOF
          # 供 native 工具链（shadow 驱动 / clang / lld-link）使用：Windows 原生路径
          LLVM_WIN="$(cygpath -w "$LLVM_DIR")"
          echo "LLVM_HOME=$LLVM_WIN" >> "$GITHUB_ENV"
          # 供 bash 侧工具（llc/clang/llvm-objcopy）使用：加入 PATH
          echo "$LLVM_DIR/bin" >> "$GITHUB_PATH"
          "$LLVM_DIR/bin/llc.exe" --version | head -1

      # 自举链：冻结种子 build/shadow.exe（已入库）把 tools/build_shadow.shadow 编成驱动
      # build/build_shadow.exe，再运行驱动执行 7 阶段自举，部署出 build/shadow.exe + rt/*.o。
      - name: Bootstrap shadow.exe (self-host)
        run: bash tools/bootstrap.sh

      - name: Verify self-hosted compiler
        run: |
          build/shadow.exe --version
          echo "self-host OK"
